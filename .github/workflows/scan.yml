name: MEXC star scanner

on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print signals only, no Telegram"
        default: "false"

permissions:
  contents: write

concurrency:
  group: mexc-star-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Save sent-alert state
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state/sent.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update scanner state"
            git pull --rebase --autostash || true
            git push
          fi
